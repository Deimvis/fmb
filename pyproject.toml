[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmb"
version = "0.1.0"
description = "Fast commit + push + watch CI"
requires-python = ">=3.10"

[project.scripts]
fmb = "fmb.cli:main"
fmb-config = "fmb.config_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
